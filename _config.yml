# Minima date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%b %-d, %Y"

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
header_pages:
  #- research.md
  #- teaching.md
  #- publications.md
  - about.md
  - posts.md
  - holdings.md
#- cv.md

permalink: pretty
show_excerpts: true # set to true to show excerpts on the homepage

# Build settings
theme: minima
sass:
  style: compressed

exclude:
  - _brain
  - _memo
  - _research
  - _syllabi
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - SEO-AUDIT.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - graphify-out
  - '*.py'
  - '*.gv'
  - assets/slides

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Metadata stays here so published post sources remain unchanged.
defaults:
  - scope: {path: "assets"}
    values:
      sitemap: false
  - scope: {path: "Profile.pdf"}
    values:
      sitemap: false
  - scope: {path: "index.md"}
    values:
      description: Essays and projects by Tony Park on software, AI, investing, startups, and film.
      image: /assets/banner-1200.webp
  - scope: {path: "posts.md"}
    values:
      canonical_url: https://realtonypark.github.io/
      sitemap: false
  - scope: {path: "about.md"}
    values:
      description: Find Tony Park's featured writing, software projects, and affiliated websites.
      seo:
        type: Person
        name: Tony (Seunghyeon) Park
  - scope: {path: "posts-by-tag.md"}
    values:
      description: Browse Tony Park's writing by topic, including software development, projects, investing, essays, and film.
  - scope: {path: "holdings.md"}
    values:
      robots: noindex, follow
      sitemap: false
  - scope: {path: "publications.md"}
    values:
      robots: noindex, follow
      sitemap: false
  - scope: {path: "grad.html"}
