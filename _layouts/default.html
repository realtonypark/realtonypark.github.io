<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body{% if page.layout == 'post' %} class="is-post"{% endif %}>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="toc-wrapper">
        <div class="sidetoc">
          {% if page.toc == true %}
            <p class="syl-toc-title">Contents</p>
            {% include toc.html html=content sanitize=true class="syl-toc" id="my_toc" submenu_class="syl-toc-sub" h_min=2 h_max=3 %}
          {% endif %}
        </div>
        
        <div class="wrapper">
          {{ content }}
        </div>
      </div>
    </main>

    {%- include footer.html -%}
    <script type="text/javascript">{%- include js-sort.js -%}</script>
    <!-- from https://github.com/CharlesStover/table-sort -->
    <script type="text/javascript">{%- include blog-nav.js -%}</script>
  </body>

</html>
