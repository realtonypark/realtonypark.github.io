<head>
    <meta charset="utf-8">
    <script>if (location.hostname === 'realtonypark.github.io') location.replace('https://tonypark.dev' + location.pathname + location.search + location.hash);</script>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/icon.svg' | relative_url }}">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>{%- include design-language.js -%}</script>
    {%- seo -%}
    {% if page.layout == 'post' and page.image == nil %}
      {% assign first_image_tag = content | split: '<img ' | slice: 1 | first %}
      {% if first_image_tag %}
        {% assign post_image = first_image_tag | split: 'src="' | last | split: '"' | first %}
      {% else %}
        {% assign post_image = '/assets/og-share-1200x630.jpg' %}
      {% endif %}
      <meta property="og:image" content="{{ post_image | relative_url | absolute_url }}">
      <meta name="twitter:image" content="{{ post_image | relative_url | absolute_url }}">
    {% endif %}
    <meta name="robots" content="{{ page.robots | default: 'max-image-preview:large' }}">
    
    <link rel="preload" href="{{ '/assets/fonts/inter-var-core.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/fonts/fonts.css' | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">

    {%- feed_meta -%}
    {%- if site.google_analytics -%}
      {%- include google-analytics4.html -%}
    {%- endif -%}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P1NKJG1GJ2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-P1NKJG1GJ2');
    </script>
    {%- if jekyll.environment == "production" -%}
    <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "7fecad21239a40db9fa47ed7f7ad34fc"}'></script><!-- End Cloudflare Web Analytics -->
    {%- endif -%}
  </head>
